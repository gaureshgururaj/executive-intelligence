services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-executive}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-executive}
      POSTGRES_DB: ${POSTGRES_DB:-executive_intelligence}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-executive} -d ${POSTGRES_DB:-executive_intelligence}",
        ]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
